[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnprio"
version = "0.1.0"
description = "Turn OpenVAS or Nessus reports into a short, ranked fix list using CISA KEV, internet exposure and asset importance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["defusedxml>=0.7", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulnprio = "vulnprio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
